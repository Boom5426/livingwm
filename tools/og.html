<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LivingWM social preview</title>
<!-- Rendered to assets/img/og.png (1200x630) by tools/build_assets.py.

<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../assets/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070b14; color: #edf1f8; font-family: "Inter", sans-serif; }
  .hero { position: relative; height: 630px; isolation: isolate; }
  .cells { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
  .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(7,11,20,.96) 0%, rgba(7,11,20,.85) 42%, rgba(7,11,20,.25) 75%, rgba(7,11,20,.1) 100%); }
  .inner { padding: 70px 72px; }
  .status { display: inline-flex; align-items: center; gap: 10px; padding: 7px 15px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; font-size: 17px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #d5dcea; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #5ff0bf; box-shadow: 0 0 12px #5ff0bf; }
  h1 { margin: 34px 0 0; font: 800 104px/0.94 "Bricolage Grotesque", sans-serif; letter-spacing: -0.04em; }
  .glow { background: linear-gradient(95deg, #5ff0bf 10%, #8ab8ff 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 22px 0 0; font-size: 32px; font-weight: 500; color: #dbe2ee; }
  .meta { margin-top: 26px; font-size: 24px; font-weight: 500; color: #a9b3c6; }
</style>
</head>
<body>
  <div class="hero">
    <canvas class="cells"></canvas>
    <div class="shade"></div>
    <div class="inner">
      <div class="status"><span class="dot"></span>Workshop proposal · CVPR 2027</div>
      <h1><span class="glow">Living</span> World<br>Models</h1>
      <p class="sub">From Vision to Experiments</p>
      <p class="meta">Seattle · 20 or 21 June 2027 · Half day</p>
    </div>
  </div>
  <script src="../assets/js/cells.js"></script>
</body>
</html>
